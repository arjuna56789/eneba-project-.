<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eneba-style Marketplace</title>
<style>
:root{--bg:#12062e;--card:#1e0f45;--line:#33205f;--ac:#7c4dff;--cta:#ffb400;--tx:#f3efff;--mu:#a99ccf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,Arial,sans-serif}
a{color:inherit;text-decoration:none}header{background:#0b0320;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;gap:16px;align-items:center}
.logo{font-weight:800;font-size:24px;color:var(--cta);letter-spacing:-1px}
input,select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font:inherit}
.bar input{flex:1;max-width:560px}main{max-width:1200px;margin:auto;padding:20px 16px}
.btn{background:var(--cta);color:#1a1000;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.s{background:var(--ac);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);transition:.15s}.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800}.pad{padding:12px}
.tag{color:var(--mu);font-size:12px}.price{font-weight:800;font-size:18px}.off{background:#2bb673;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;margin-left:6px}
.banner{border-radius:16px;padding:48px 36px;margin-bottom:24px}.banner h1{margin:0;font-size:40px}
h2{margin:28px 0 12px}.row{display:flex;gap:16px;align-items:flex-start}aside{width:220px;flex:none;display:flex;flex-direction:column;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);padding:12px 16px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.err{color:#ff6b81}.ok{color:#2bb673}form{display:flex;flex-direction:column;gap:10px;max-width:360px}
@media(max-width:700px){.row{flex-direction:column}aside{width:100%}.bar{flex-wrap:wrap}}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const api=async(p,o={})=>{const t=ls('auth',null)?.token;
 const r=await fetch('/api'+p,{method:o.body?'POST':'GET',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:o.body&&JSON.stringify(o.body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j};
const useData=(p)=>{const[d,setD]=useState(null);const[e,setE]=useState('');useEffect(()=>{setD(null);api(p).then(setD).catch(x=>setE(x.message))},[p]);return[d,e]};
const useHash=()=>{const[h,setH]=useState(location.hash.slice(1)||'/');useEffect(()=>{const f=()=>setH(location.hash.slice(1)||'/');addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return h};
const eur=n=>'€'+n.toFixed(2);

function Card({p}){return <a href={'#/product/'+p.id} className="card">
 <div className="cover" style={{background:`linear-gradient(135deg,hsl(${p.hue},70%,35%),hsl(${p.hue+40},70%,18%))`}}>{p.name[0]}</div>
 <div className="pad"><div style={{fontWeight:600,height:44,overflow:'hidden'}}>{p.name}</div>
 <div className="tag">{p.platform} · {p.region}</div>
 <div><span className="tag">from </span><span className="price">{eur(p.price)}</span>{p.discount>0&&<span className="off">-{p.discount}%</span>}</div></div></a>}

function Block({title,path}){const[d,e]=useData(path);return <section><h2>{title}</h2>{e&&<p className="err">{e}</p>}{!d&&!e&&<p className="tag">Loading…</p>}{d&&<div className="grid">{d.map(p=><Card key={p.id} p={p}/>)}</div>}</section>}

function Home(){const[b]=useData('/home/banner');const[i,setI]=useState(0);
 useEffect(()=>{if(!b)return;const t=setInterval(()=>setI(x=>(x+1)%b.length),4000);return()=>clearInterval(t)},[b]);
 const s=b&&b[i];
 return <>{s&&<a href={s.link} className="banner" style={{display:'block',background:`linear-gradient(120deg,hsl(${s.hue},70%,40%),#12062e)`}}><h1>{s.title}</h1><p>{s.text}</p></a>}
 <Block title="Best sellers" path="/home/bestsellers"/><Block title="Hot deals" path="/home/deals"/></>}

function Store({qs}){const sp=new URLSearchParams(qs);const[f,setF]=useState({q:sp.get('q')||'',platform:'',region:'',min:'',max:'',sort:sp.get('sort')||''});
 useEffect(()=>setF(x=>({...x,q:sp.get('q')||'',sort:sp.get('sort')||x.sort})),[qs]);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const url='/products?'+new URLSearchParams(Object.entries(f).filter(([,v])=>v));
 const[d,e]=useData(url);
 return <div className="row"><aside>
  <input placeholder="Search by name" value={f.q} onChange={set('q')}/>
  <select value={f.platform} onChange={set('platform')}><option value="">All platforms</option>{['Steam','Xbox','PlayStation','Nintendo'].map(x=><option key={x}>{x}</option>)}</select>
  <select value={f.region} onChange={set('region')}><option value="">All regions</option>{['Global','Europe','United States'].map(x=><option key={x}>{x}</option>)}</select>
  <div style={{display:'flex',gap:6}}><input placeholder="Min €" value={f.min} onChange={set('min')} style={{width:'50%'}}/><input placeholder="Max €" value={f.max} onChange={set('max')} style={{width:'50%'}}/></div>
  <select value={f.sort} onChange={set('sort')}><option value="">Best selling</option><option value="price_asc">Price: low → high</option><option value="price_desc">Price: high → low</option><option value="name">Name</option></select></aside>
  <div style={{flex:1}}>{e&&<p className="err">{e}</p>}{d&&!d.length&&<p>No results. Try a different spelling or filter.</p>}{d&&<div className="grid">{d.map(p=><Card key={p.id} p={p}/>)}</div>}</div></div>}

function Product({id,cart,setCart}){const[p,e]=useData('/products/'+id);if(e)return <p className="err">{e}</p>;if(!p)return <p>Loading…</p>;
 const add=o=>{const c=[...cart];const x=c.find(i=>i.offerId===o.id);x?x.qty++:c.push({offerId:o.id,name:p.name,seller:o.seller,price:o.price,qty:1});setCart(c);location.hash='/cart'};
 return <><div className="row"><div className="card" style={{width:280,flex:'none'}}><div className="cover" style={{height:200,background:`linear-gradient(135deg,hsl(${p.hue},70%,35%),hsl(${p.hue+40},70%,18%))`}}>{p.name[0]}</div></div>
 <div><h1 style={{margin:0}}>{p.name}</h1><p className="tag">{p.platform} · {p.region} · {p.genre} · {p.sold} sold</p><p>Instant digital key delivery after payment. Compare {p.offers.length} sellers below.</p></div></div>
 <h2>Offers</h2>{[...p.offers].sort((a,b)=>a.price-b.price).map((o,i)=><div className="line" key={o.id}>
  <div><b>{o.seller}</b> {i===0&&<span className="off">Best price</span>}<div className="tag">★ {o.rating.toFixed(1)}</div></div>
  <div><span className="price">{eur(o.price)}</span> <button className="btn" onClick={()=>add(o)}>Add to cart</button></div></div>)}</>}

function Cart({cart,setCart,auth}){const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 const rm=id=>setCart(cart.filter(i=>i.offerId!==id));
 if(!cart.length)return <><h1>Cart</h1><p>Your cart is empty. <a href="#/store" style={{color:'var(--cta)'}}>Browse the store</a></p></>;
 return <><h1>Cart</h1>{cart.map(i=><div className="line" key={i.offerId}><div><b>{i.name}</b><div className="tag">{i.seller} × {i.qty}</div></div><div><span className="price">{eur(i.price*i.qty)}</span> <button className="btn s" onClick={()=>rm(i.offerId)}>✕</button></div></div>)}
 <h2>Total: {eur(total)}</h2><a href={auth?'#/checkout':'#/login?next=/checkout'}><button className="btn">{auth?'Checkout':'Sign in to checkout'}</button></a></>}

function Checkout({cart,setCart,auth}){const[card,setCard]=useState('4242 4242 4242 4242');const[err,setErr]=useState('');const[o,setO]=useState(null);const[busy,setBusy]=useState(false);
 if(!auth)return <p>Please <a href="#/login?next=/checkout" style={{color:'var(--cta)'}}>sign in</a> to check out.</p>;
 if(o)return <><h1 className="ok">Payment successful</h1><p>Order {o.id} · {eur(o.total)}</p><Keys o={o}/></>;
 const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 const pay=async()=>{setBusy(true);setErr('');try{const r=await api('/checkout',{body:{card,items:cart.map(i=>({OfferID:i.offerId,Qty:i.qty}))}});setO(r);setCart([])}catch(x){setErr(x.message)}setBusy(false)};
 return <><h1>Checkout</h1><p>Total: <b>{eur(total)}</b> (simulated payment, no real money)</p>
 <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:360}}><input value={card} onChange={e=>setCard(e.target.value)}/>
 {err&&<span className="err">{err}</span>}<button className="btn" disabled={busy||!cart.length} onClick={pay}>{busy?'Processing…':'Pay '+eur(total)}</button></div></>}
const Keys=({o})=><>{o.lines.map((l,i)=><div className="line" key={i}><div><b>{l.name}</b><div className="tag">{l.seller}</div></div><code style={{color:'var(--cta)'}}>{l.key}</code></div>)}</>;

function Orders({auth}){const[d,e]=useData('/orders');if(!auth)return <p>Please <a href="#/login?next=/orders" style={{color:'var(--cta)'}}>sign in</a>.</p>;
 return <><h1>Order history</h1>{e&&<p className="err">{e}</p>}{d&&!d.length&&<p>No orders yet.</p>}{d&&d.map(o=><div key={o.id}><h3>{o.id} <span className="tag">{o.date} · {eur(o.total)}</span></h3><Keys o={o}/></div>)}</>}

function Auth({mode,qs,setAuth}){const[f,setF]=useState({email:'',password:''});const[err,setErr]=useState('');
 const go=async e=>{e.preventDefault();try{const r=await api('/auth/'+mode,{body:f});setAuth(r);location.hash=new URLSearchParams(qs).get('next')||'/'}catch(x){setErr(x.message)}};
 return <><h1>{mode==='login'?'Sign in':'Create account'}</h1><form onSubmit={go}>
 <input placeholder="Email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/>
 <input type="password" placeholder="Password (6+ chars)" value={f.password} onChange={e=>setF({...f,password:e.target.value})}/>
 {err&&<span className="err">{err}</span>}<button className="btn">{mode==='login'?'Sign in':'Register'}</button></form>
 <p className="tag">{mode==='login'?<>No account? <a href={'#/register?'+qs} style={{color:'var(--cta)'}}>Register</a></>:<>Have an account? <a href={'#/login?'+qs} style={{color:'var(--cta)'}}>Sign in</a></>}</p></>}

function App(){const h=useHash();const[path,qs='']=h.split('?');
 const[cart,setCartS]=useState(ls('cart',[]));const[auth,setAuthS]=useState(ls('auth',null));const[q,setQ]=useState('');
 const setCart=c=>{setCartS(c);localStorage.setItem('cart',JSON.stringify(c))};
 const setAuth=a=>{setAuthS(a);a?localStorage.setItem('auth',JSON.stringify(a)):localStorage.removeItem('auth')};
 const search=e=>{e.preventDefault();location.hash='/store?q='+encodeURIComponent(q)};
 let v;const m=path.match(/^\/product\/(\d+)/);
 if(m)v=<Product id={m[1]} cart={cart} setCart={setCart}/>;
 else if(path==='/store')v=<Store qs={qs}/>;
 else if(path==='/cart')v=<Cart cart={cart} setCart={setCart} auth={auth}/>;
 else if(path==='/checkout')v=<Checkout cart={cart} setCart={setCart} auth={auth}/>;
 else if(path==='/orders')v=<Orders auth={auth}/>;
 else if(path==='/login'||path==='/register')v=<Auth mode={path.slice(1)} qs={qs} setAuth={setAuth}/>;
 else v=<Home/>;
 return <><header><div className="bar"><a href="#/" className="logo">eneba*</a>
 <form onSubmit={search} style={{flex:1,flexDirection:'row',maxWidth:'none'}}><input style={{width:'100%'}} placeholder="Search games, gift cards, software…" value={q} onChange={e=>setQ(e.target.value)}/></form>
 <a href="#/store">Store</a><a href="#/cart">Cart{cart.length>0&&` (${cart.reduce((s,i)=>s+i.qty,0)})`}</a>
 {auth?<><a href="#/orders">Orders</a><a href="#/" onClick={()=>setAuth(null)}>Sign out</a></>:<a href="#/login">Sign in</a>}</div></header><main key={h}>{v}</main></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
